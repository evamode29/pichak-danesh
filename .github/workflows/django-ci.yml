name: Django CI

on:
  push:
    branches: [main, safe/teacher-panel-foundation]
  pull_request:
    branches: [main, production-baseline-2026-11-02]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key"
          DJANGO_DISABLE_EXAMS_MIGRATIONS: "True"
        run: python manage.py check

      - name: Apply migrations
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key"
          DJANGO_DISABLE_EXAMS_MIGRATIONS: "True"
        run: python manage.py migrate --noinput

      - name: Collect static files for tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key"
          DJANGO_DISABLE_EXAMS_MIGRATIONS: "True"
        run: python manage.py collectstatic --noinput

      - name: Django tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key"
          DJANGO_DISABLE_EXAMS_MIGRATIONS: "True"
        run: python manage.py test core.test_teacher_panel
