{% extends 'base.html' %}{% block title %}تأیید کد | پیچک دانش{% endblock %}{% block content %}<section class="placement-page"><div class="container placement-shell"><div class="result-card"><span class="section-kicker">تأیید شماره</span><h1>کد پیامک‌شده را وارد کن</h1><p>کد ارسال‌شده به <strong>{{ mobile }}</strong> را وارد کن.</p>{% if error %}<div class="active-box" style="background:#fff1f1;color:#a33">{{ error }}</div>{% endif %}<form method="post" style="margin-top:24px">{% csrf_token %}<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="۱۲۳۴۵۶" required style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe5ea;border-radius:12px;font:inherit;letter-spacing:5px;text-align:center;margin-bottom:16px"><button class="button primary" type="submit">تأیید و ورود</button></form><a class="placement-exit" href="{% url 'otp-request' %}">دریافت کد جدید</a></div></div></section>{% endblock %}
