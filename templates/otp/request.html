{% extends 'base.html' %}{% block title %}ورود با پیامک | پیچک دانش{% endblock %}{% block content %}<section class="placement-page"><div class="container placement-shell"><div class="result-card"><span class="section-kicker">ورود دانش‌آموز</span><h1>ورود با شماره همراه</h1><p>شماره همراهت را وارد کن تا کد یک‌بارمصرف برایت ارسال شود.</p>{% if error %}<div class="active-box" style="background:#fff1f1;color:#a33">{{ error }}</div>{% endif %}<form method="post" style="margin-top:24px"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><label>شماره همراه</label><input name="mobile" inputmode="tel" autocomplete="tel" placeholder="09123456789" required style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe5ea;border-radius:12px;font:inherit;margin:8px 0 16px"><button class="button primary" type="submit">ارسال کد ورود</button></form><p style="margin-top:18px"><a href="{% url 'login' %}">ورود معلم یا مدیر</a></p></div></div></section>{% endblock %}
