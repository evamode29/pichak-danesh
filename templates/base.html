{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15966d">
<meta name="description" content="{{ seo_description }}">
<meta name="robots" content="{{ seo_robots }}">
<link rel="canonical" href="{{ seo_canonical }}">
<meta property="og:type" content="website"><meta property="og:locale" content="fa_IR"><meta property="og:site_name" content="پیچک دانش">
<meta property="og:title" content="{% block og_title %}پیچک دانش{% endblock %}"><meta property="og:description" content="{{ seo_description }}"><meta property="og:url" content="{{ seo_canonical }}">
<script type="application/ld+json">{{ seo_schema|safe }}</script>
<title>{% block title %}پیچک دانش{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/site.css' %}"><link rel="stylesheet" href="{% static 'css/placement.css' %}"><link rel="stylesheet" href="{% static 'css/polish.css' %}"><link rel="stylesheet" href="{% static 'css/premium.css' %}">
<style>
.simple-header{background:#fff;border-bottom:1px solid #e6eee8;position:relative;z-index:5}.simple-header-inner{max-width:1160px;min-height:76px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.simple-brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#173c27;font-size:21px;font-weight:800}.simple-brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#176b38;color:#fff;font-size:22px}.simple-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.simple-nav a{display:inline-block;text-decoration:none;color:#176b38;font-weight:800;font-size:14px;padding:10px 14px;border-radius:11px;background:#edf6ef}.simple-footer{padding:22px 18px;text-align:center;color:#77847b;background:#fff;border-top:1px solid #e6eee8;font-size:13px}@media(max-width:520px){.simple-header-inner{min-height:66px;padding:10px 14px}.simple-brand{font-size:18px}.simple-brand-mark{width:36px;height:36px}.simple-nav{gap:5px}.simple-nav a{font-size:12px;padding:9px}}
</style>
</head>
<body>
<header class="simple-header"><div class="simple-header-inner">
<a class="simple-brand" href="/" aria-label="پیچک دانش"><span class="simple-brand-mark">پ</span><span>پیچک <strong>دانش</strong></span></a>
<nav class="simple-nav" aria-label="منوی اصلی">
{% if user.is_authenticated %}<a href="{% url 'simple-student' %}">پنل من</a><a href="{% url 'simple-iq' %}">آزمون هوش تصویری</a><a href="{% url 'logout' %}">خروج</a>{% else %}<a href="{% url 'login' %}">ورود</a>{% endif %}
</nav></div></header>
<main>{% block content %}{% endblock %}</main>
<footer class="simple-footer"><strong>پیچک دانش</strong> · فضای ساده یادگیری پایه ششم · © {% now "Y" %}</footer>
</body></html>
