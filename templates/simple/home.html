{% extends 'base.html' %}
{% block title %}ورود | پیچک دانش{% endblock %}
{% block content %}
<style>
.simple-wrap{min-height:76vh;background:radial-gradient(circle at 15% 15%,#dff5e8,transparent 35%),#f6faf7;padding:48px 18px;display:grid;place-items:center}
.simple-card{width:min(560px,100%);background:#fff;border:1px solid #e2eee5;border-radius:28px;padding:clamp(28px,6vw,54px);box-shadow:0 24px 70px #16472a12;text-align:center}
.simple-mark{width:66px;height:66px;border-radius:22px;background:#176b38;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 18px}
.simple-card h1{font-size:clamp(28px,5vw,42px);margin:0;color:#173c27}
.simple-card p{color:#697a70;line-height:2;margin:14px auto 26px;max-width:430px}
.simple-btn{display:inline-block;padding:14px 28px;border-radius:14px;text-decoration:none;font-weight:800;background:#176b38;color:#fff}
.simple-note{font-size:12px!important;margin-top:22px!important}
</style>
<section class="simple-wrap" dir="rtl">
  <div class="simple-card">
    <div class="simple-mark">پ</div>
    <h1>ورود به پیچک دانش</h1>
    <p>دانش‌آموز یا معلم عزیز، با نام کاربری و رمز عبور خود وارد شو.</p>
    <a class="simple-btn" href="{% url 'login' %}">ورود با نام کاربری و رمز</a>
    <p class="simple-note">برای حفظ امنیت، حساب‌های موجود و رمزهایشان بدون تغییر باقی می‌مانند.</p>
  </div>
</section>
{% endblock %}
